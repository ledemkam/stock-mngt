name: Integration Tests (Tenant & Repositories)

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: {}

concurrency:
  group: integration-tests
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests (Testcontainers + Repositories)
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: '-Xmx2g -XX:+TieredCompilation'
      # Optional: speed-up Testcontainers on CI if you enabled reuse (not required)
      # TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Show environment
        run: |
          java -version
          ./mvnw -v

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Build (compile only)
        run: ./mvnw -B -DskipTests package

      - name: Run Tenant migration integration test
        # Exécute uniquement le test TenantMigrationIntegrationTest
        run: ./mvnw -B -Dtest=TenantMigrationIntegrationTest test
        continue-on-error: false

      - name: Run repository integration tests
        # Exécute les tests correspondant aux patterns de repository.
        # Ajustez les patterns si vos classes de test utilisent une autre convention.
        run: |
          # Examples of patterns:
          # - **/*RepositoryTest  (e.g. ProductRepositoryTest)
          # - **/*RepositoryIT    (if you have *IT naming for integration tests)
          ./mvnw -B -Dtest="**/*RepositoryTest,**/*RepositoryIT,**/*Repository*Test" test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/**
            target/surefire-reports/**

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            backend/target/failsafe-reports/**
            target/failsafe-reports/**
