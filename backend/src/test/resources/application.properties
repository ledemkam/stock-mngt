# Disable SpringDoc/Swagger in test context to avoid conditional bean evaluation errors
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Allow Hibernate to create/drop schema in H2 for @DataJpaTest (overrides ddl-auto: none from application.yaml)
spring.jpa.hibernate.ddl-auto=create-drop
# Disable Flyway in tests: application.yaml enables it, but Flyway migrations use PostgreSQL-specific SQL
# that H2 cannot parse. Hibernate DDL (create-drop above) creates the schema instead.
spring.flyway.enabled=false